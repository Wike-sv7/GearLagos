<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/ikon.png">
    <title>GEAR LAGOS - Car Rental Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-container">
        <table class="header-table">
            <tr>
                <td width="15%"><img src="images/ikon.png" alt="GEAR LAGOS Logo" width="120"></td>
                <td width="70%">
                    <h1 class="brand-title">
                        <span class="gear">GEAR</span><span class="lagos">LAGOS</span>
                    </h1>
                    <p>Lagos Number 1 Car Rental Service</p>
                    <p>45 Rental Avenue, Lagos, Nigeria</p>
                </td>
                <td width="15%" class="social-icons">
                    <img src="images/tele.jpg"    alt="Telegram"   width="25">
                    <img src="images/wozzles.jpeg" alt="Instagram"  width="25">
                    <img src="images/what.png"    alt="WhatsApp"   width="25">
                    <img src="images/email.jpg"   alt="Email"      width="25">
                </td>
            </tr>
        </table>
    </header>

    <nav class="main-nav">
        <ul>
            <li><a href="lagos.html">Lagos Utility</a></li>
            <li><a href="book.html">Book a Ride</a></li>
            <li><a href="aboutus.html">About Us</a></li>
            <li><a href="visitus.html">Visit Showroom</a></li>
        </ul>
    </nav>

    <!-- ── PAYMENT MODAL ─────────────────────────────────── -->
    <div class="payment-modal-overlay" id="paymentModalOverlay">

        <!-- Card form -->
        <div class="payment-card" id="paymentFormBox">
            <button class="login-modal-close" onclick="closePaymentModal()">&times;</button>
            <h3>Secure Card Payment</h3>
            <p style="font-size:13px; color:#666; margin-bottom:15px;">Powered by Paystack Secure</p>

            <label style="font-weight:bold; font-size:13px;">Card Number</label>
            <input type="text" class="payment-input" placeholder="0000 0000 0000 0000" maxlength="19">

            <div style="display:flex; gap:15px; margin-top:10px;">
                <div style="flex:1;">
                    <label style="font-weight:bold; font-size:13px;">Expiry</label>
                    <input type="text" class="payment-input" placeholder="MM/YY" maxlength="5">
                </div>
                <div style="flex:1;">
                    <label style="font-weight:bold; font-size:13px;">CVV</label>
                    <input type="password" class="payment-input" placeholder="123" maxlength="3">
                </div>
            </div>

            <button class="btn-primary" style="width:100%; margin-top:15px;" onclick="processPayment()">
                Pay Now
            </button>
        </div>

        <!-- Processing spinner -->
        <div class="payment-card spinner-box" id="paymentProcessingBox" style="display:none;">
            <div class="loader"></div>
            <h3 style="border:none; text-align:center;">Processing Payment...</h3>
            <p style="color:#666; text-align:center;">Please do not drive off this window.</p>
        </div>

    </div>
    <!-- ── END PAYMENT MODAL ──────────────────────────────── -->

    <!--
        Put your checkout form content here.
        To open the payment modal from a Pay button, use:
        <button onclick="openPaymentModal()">Proceed to Payment</button>
    -->

    <footer class="site-footer">
        <p class="copyright" style="padding-top:10px;">&copy; 2026 GEAR LAGOS Car Rental Service</p>
    </footer>

    <script src="booking.js"></script>
</body>
</html>
